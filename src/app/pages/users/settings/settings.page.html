<!-- ========================= -->
<!-- 🧭 HEADER -->
<!-- ========================= -->
<ion-header [class.hidden]="hideHeader">
  <ion-toolbar class="transparent-toolbar">

    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>Configuración</ion-title>

  </ion-toolbar>
</ion-header>

<!-- ========================= -->
<!-- 📄 CONTENIDO -->
<!-- ========================= -->
<ion-content (ionScroll)="onScroll($event)" [scrollEvents]="true">

  <!-- ========================= -->
  <!-- 👤 CUENTA -->
  <!-- ========================= -->
  <div class="section-title">
    <ion-icon name="person-outline" color="primary"></ion-icon>
    <h3>Cuenta</h3>
  </div>

  <ion-card>
    <ion-list lines="full">

      <ion-item button detail (click)="onChangePassword()">
        <ion-icon name="lock-closed-outline" slot="start" color="primary"></ion-icon>

        <ion-label>
          <h3>Cambiar contraseña</h3>
          <p>Actualiza tu contraseña de acceso</p>
        </ion-label>
      </ion-item>

    </ion-list>
  </ion-card>

  <!-- ========================= -->
  <!-- ⚠️ ZONA DE PELIGRO -->
  <!-- ========================= -->
  <div class="section-title">
    <ion-icon name="warning-outline" color="danger"></ion-icon>
    <h3>Zona de peligro</h3>
  </div>

  <ion-card color="light">
    <ion-list lines="full">

      <ion-item button detail (click)="onDeleteAccount()">
        <ion-icon name="trash-outline" slot="start" color="danger"></ion-icon>

        <ion-label>
          <h3 style="color: var(--ion-color-danger)">
            Eliminar cuenta
          </h3>
          <p>Esta acción es irreversible</p>
        </ion-label>
      </ion-item>

    </ion-list>
  </ion-card>

</ion-content>
