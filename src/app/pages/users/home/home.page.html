<!-- src/app/pages/home/home.page.html -->

<ion-header [class.hidden]="hideHeader">
  <ion-toolbar class="transparent-toolbar">

    <ion-title>Inicio</ion-title>

    <!-- 🌤️ CLIMA CENTRADO -->
    <ion-button fill="clear" class="weather-header" (click)="openWeatherLink()">
      <ion-icon [name]="weatherGlobal.icon | async"></ion-icon>
      <span>{{ weatherGlobal.temperature | async }}° </span>
      <span>| {{ timeService.dateTime | async }}</span>
    </ion-button>

    <ion-buttons slot="end">

      <!-- 🏠 BOTÓN DASHBOARD - Solo visible para admin -->
      <ion-button *ngIf="userData?.rol === 'admin'" (click)="goDashboard()">
        <ion-icon slot="icon-only" name="grid-outline"></ion-icon>
      </ion-button>

      <!-- 🚪 LOGOUT -->
      <ion-button (click)="onLogout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>

    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content (ionScroll)="onScroll($event)" [scrollEvents]="true">

  <!-- BIENVENIDA -->
  <div class="welcome-container" *ngIf="userData">

    <div class="welcome-header">
      <ion-icon name="person-circle-outline" class="avatar-icon"></ion-icon>
      <h1>¡Hola, {{ userData.nombre }}!</h1>
      <p>Bienvenido a tu inicio. Explora tu información y mantente al día con la app.</p>
      <p>Tus próxima aventura te esperan</p>
      <ion-badge [color]="userData.rol === 'admin' ? 'danger' : 'primary'">
        {{ userData.rol === 'admin' ? 'Administrador' : 'Usuario' }}
      </ion-badge>
    </div>


  </div>

  <!-- SKELETON mientras carga -->
  <!-- <app-explore-container *ngIf="!userData">
    <ion-skeleton-text animated style="height: 80px; border-radius: 8px;"></ion-skeleton-text>
    <ion-skeleton-text animated style="height: 200px; border-radius: 8px; margin-top: 16px;"></ion-skeleton-text>
  </app-explore-container> -->

</ion-content>
