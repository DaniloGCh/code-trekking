<ion-content fullscreen>

  <div class="map-container">

    <div id="map"></div>

    <!-- 🔵 BOTÓN CENTRAR USUARIO -->
    <ion-button class="center-btn" fill="clear" (click)="centrarEnUsuario()">
      <ion-icon name="navigate"></ion-icon>
    </ion-button>

  </div>

  <!-- 📊 PANEL INFERIOR -->
  <div class="map-info">

    <div class="info-card">

      <div class="stats-panel">

        <!-- 📏 DISTANCIA -->
        <div class="stat-item">
          <div>
            <strong>Distancia recorrida</strong>
            <p>{{ distanceKm | number:'1.2-2' }} km</p>
          </div>
        </div>

        <!-- 🔴 ESTADO TRACKING -->
        <div class="stat-item">
          <div>
            <strong>Tracking</strong>
            <p>
              {{ trackingActive ? 'Activo' : 'Detenido' }}
            </p>
          </div>
        </div>

            <!-- ▶️⏸ BOTÓN START / STOP TRACKING -->
    <ion-button
      class="tracking-btn"
      [color]="trackingActive ? 'danger' : 'success'"
      (click)="toggleTracking()"
    >
      <ion-icon [name]="trackingActive ? 'pause' : 'play'"></ion-icon>
      {{ trackingActive ? 'Pausar' : 'Iniciar' }} tracking
    </ion-button>

      </div>

      <!-- 📦 EXPORT GPX -->
      <ion-button expand="block" class="gpx-btn" (click)="exportGPX()">
        📦 Exportar GPX
      </ion-button>

    </div>

  </div>

</ion-content>
