<ion-content fullscreen>

  <div class="map-container">
    <div id="map"></div>

    <!-- 🔵 BOTÓN CENTRAR -->
    <ion-button class="center-btn" fill="clear" (click)="centrarEnUsuario()">
      <ion-icon name="locate"></ion-icon>
    </ion-button>

    
    
  </div>

<!-- ✅ SELECTOR TIPO MAPA CON ACCORDION -->
<div class="map-type-selector">

  <!-- Botón principal -->
  <button class="map-type-toggle" (click)="mostrarTipos = !mostrarTipos">
    🗺️ Mapa
    <ion-icon [name]="mostrarTipos ? 'chevron-up-outline' : 'chevron-down-outline'"></ion-icon>
  </button>

  <!-- Opciones desplegables -->
  <div class="map-type-options" [class.visible]="mostrarTipos">

    <button
      class="map-type-btn"
      [class.active]="tipoMapaActual === 'calle'"
      (click)="cambiarTipaMapa('calle'); mostrarTipos = false">
      🗺️ 
    </button>

    <button
      class="map-type-btn"
      [class.active]="tipoMapaActual === 'satelital'"
      (click)="cambiarTipaMapa('satelital'); mostrarTipos = false">
      🛰️ 
    </button>
<!-- 
    <button
      class="map-type-btn"
      [class.active]="tipoMapaActual === 'terreno'"
      (click)="cambiarTipaMapa('terreno'); mostrarTipos = false">
      🏔️ 
    </button> -->

    <button
      class="map-type-btn"
      [class.active]="tipoMapaActual === 'topo'"
      (click)="cambiarTipaMapa('topo'); mostrarTipos = false">
      📐
    </button>
    

  </div>

</div>

  <!-- 📊 PANEL INFERIOR -->
  <div class="map-info">
    <div class="info-card">

      <!-- STATS -->
      <div class="stats-panel">

        <!-- 📏 DISTANCIA -->
        <div class="stat-item">
          <ion-icon name="map-outline" color="primary"></ion-icon>
          <div>
            <small>Distancia</small>
            <strong>{{ distanceKm | number:'1.2-2' }} km</strong>
          </div>
        </div>

        <!-- ⏱️ TIEMPO -->
        <div class="stat-item">
          <ion-icon name="time-outline" color="primary"></ion-icon>
          <div>
            <small>Tiempo</small>
            <strong>{{ tiempoFormateado }}</strong>
          </div>
        </div>

        <!-- 📍 COORDENADAS -->
        <div class="stat-item coordenadas">
          <ion-icon name="location-outline" color="primary"></ion-icon>
          <div>
            <small>Coordenadas</small>
            <strong>{{ coordenadasFormateadas }}</strong>
          </div>
        </div>

      </div>

      <!-- BOTONES -->
      <div class="action-buttons">

        <!-- ▶️ TOGGLE TRACKING -->
        <ion-button
          [color]="trackingActive ? 'danger' : 'success'"
          expand="block"
          (click)="toggleTracking()">
          <ion-icon [name]="trackingActive ? 'pause' : 'play'" slot="start"></ion-icon>
          {{ trackingActive ? 'Detener' : 'Iniciar' }}
        </ion-button>

        <!-- 🗑️ LIMPIAR RUTA -->
        <ion-button
          color="warning"
          expand="block"
          (click)="onLimpiarRuta()">
          <ion-icon name="trash-outline" slot="start"></ion-icon>
          Limpiar
        </ion-button>

        <!-- 📦 EXPORT GPX -->
        <ion-button
          color="tertiary"
          expand="block"
          (click)="exportGPX()"
          [disabled]="routePoints.length === 0">
          <ion-icon name="download-outline" slot="start"></ion-icon>
          GPX
        </ion-button>

            <ion-buttons>
      <ion-button (click)="goHome()">
        <ion-icon slot="icon-only" name="home-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

      </div>

    </div>
  </div>

</ion-content>
