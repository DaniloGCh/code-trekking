<ion-content fullscreen>

  <div class="map-container">

    <div id="map"></div>

    <!-- 🔵 BOTÓN CENTRAR USUARIO -->
    <ion-button class="center-btn" fill="clear" (click)="centrarEnUsuario()">
      <ion-icon name="locate"></ion-icon>
    </ion-button>

  </div>

  <!-- 📊 PANEL INFERIOR -->
  <div class="map-info">

    <div class="info-card">

      <div class="stats-panel">

        <!-- 📏 DISTANCIA -->
        <div class="stat-item">
          <div>
            <strong>Distancia recorrida</strong>
            <p>{{ distanceKm | number:'1.2-2' }} km</p>
          </div>
        </div>

        <!-- 🔴 INFO TRACKING (solo visual) -->
        <div class="stat-item">
          <div>
            <strong>Tracking</strong>
            <p>Activo</p>
          </div>
        </div>

      </div>

      <!-- 📦 EXPORT GPX -->
      <ion-button expand="block" class="gpx-btn" (click)="exportGPX()">
        📦 Exportar GPX
      </ion-button>

    </div>

  </div>

</ion-content>
