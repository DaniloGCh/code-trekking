<ion-app>
  <ion-router-outlet></ion-router-outlet>

  <!-- 📴 AVISO SIN CONEXIÓN: la app sigue funcionando con los datos guardados -->
  <div class="aviso-sin-conexion" *ngIf="(online$ | async) === false">
    <ion-icon name="cloud-offline-outline"></ion-icon>
    <span>Sin conexión · mostrando datos guardados</span>
  </div>

  <!-- ⏳ PANTALLA DE CARGA INICIAL: cubre la app mientras se verifica la sesión -->
  <div class="splash-carga" *ngIf="cargandoApp" [class.saliendo]="splashSaliendo">
    <img src="assets/icons/icon-512.webp" alt="Code Trekking" class="splash-logo" />
    <h1>Code Trekking</h1>
    <ion-spinner name="crescent"></ion-spinner>
  </div>
</ion-app>
