<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Code-Trekking · Pago</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="badge">⭐</div>
    <h1 id="plan-nombre">Plan</h1>
    <p class="precio" id="plan-precio">$0 USD</p>
    <p class="nota">Cobro procesado a través de PayPal</p>

    <div id="paypal-button-container"></div>
    <div class="spinner" id="spinner"></div>

    <p class="estado" id="estado"></p>
    <div class="error-box" id="error-box">
      No se pudo cargar la pasarela de pago. Verifica tu conexión e inténtalo nuevamente.
    </div>

    <a class="volver" id="volver-link">Cancelar y volver a la app</a>
  </div>

  <!-- 🐞 DEBUG TEMPORAL — borrar este <div> completo cuando ya no se necesite -->
  <div class="debug-box" id="debug-box">
    <strong>Debug (temporal)</strong>
    <div id="debug-log"></div>
  </div>
  <!-- 🐞 FIN DEBUG TEMPORAL -->

  <script src="script.js"></script>
</body>
</html>
